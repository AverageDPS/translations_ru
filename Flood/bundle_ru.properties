# Tutorial entries
tutorial.welcome.title = Добро Пожаловать!
tutorial.welcome = [lightgray] Добро Пожаловать на [accent]Интерактивное Обучение[]!\
  \nВыберите ниже категорию, чтобы узнать больше о Flood!
tutorial.reminder.title = Привет!
tutorial.reminder = [accent]Привет!\
  \n\
  \n[lightgray]Кажется, вы играли некоторое время!\
  \nПочему бы не потратить [white]одну минуту,[] чтобы прочитать обучение и узнать о новых особенностях?
tutorial.guardian.title = Обучение Стража
tutorial.guardian = [accent]Вы являеетесь Стражем!\
  \n\
  \n[lightgray]Ваша цель – помочь Flood победить команду игроков:\
  \n[accent]>[] Содействуйте Flood в атаках на игроков.\
  \n[accent]>[] Возводите ловушки и сооружения внутри Flood.\
  \n[accent]>[] Используйте [slate]/tutorial[] для того, чтобы увидеть ваши уникальные команды.\
  \n\
  \nЕсли вы не желаете быть Стражем, воспользуйтесь [slate]/resign[] для возвращения к команде игроков.\
  \nЖелаем удачи!

tutorial.intro0 = [blue]\ue83b Flood[] – это наступательный режим. Чтобы победить, вма нужно [red]подавить[] все\
  \n[]\uf867 [stat]Излучатели[] и [red]уничтожить[] все \uf727 [stat]Заряженные Излучатели.
tutorial.intro1 = \uf867 [stat]Излучатели[] продуцируют [blue]Flood[], который [red]повреждает[] строения и войска.
tutorial.intro2 = [red]Подавите[] \uf867 [stat]Излучатели[] путём нанесения постоянного [red]урона[].\
  \n\
  \nКак только они полностью подавлены, они могут быть [orange]нуллифицированы[] с помощью подключения рядом\
  \n\uf871 [accent]Импульсного Реактора[] или \uf689 [accent]Сияния[].
tutorial.intro3 = [accent]Короткие Советы:\
  \n\
  \n\uf898[accent]Силовые Проекторы[] крайне эффективны против распространения Flood.\
  \n\uf8ae[accent]Застройка стенами[] помогает защититься раннее и продвигаться дальше.\
  \n\uf7fa[accent]Антислизь[] очень сильна для продвижения и подавления Излучателей.
tutorial.intro4 = Настоятельно рекомендуется скачать [blue]Floodcompat[] из [stat]\ue811 Браузера Модификаций[] для уменьшения лагов и десинхронизаций.
tutorial.intro5 = Существует множество [pink]уникальных особенностей[] в Flood.\
  \nИсследуйте другие категории, чтобы узнать больше!

tutorial.content0 = \uf867 [red]Излучатели[]\
  \n\
  \n[accent]Ядра Серпуло[] действуют в качестве Излучателей. Подавите их с помощью постоянного [red]урона[] или [cyan]антислизи[].\
  \n[salmon]Подавите все Излучатели[] для победы в матче.\
  \n\
  \n[orange]Нуллификация[] необязательна, но полезна.
tutorial.content1 = \uf727 [red]Заряженные Излучатели[]\
  \n\
  \n[accent]Ядра Эрекира[] и [accent]Пусковые Площадки[] должны зарядиться, прежде чем обрушить огромное количество [blue]Flood[].\
  \nОни [accent]неуязвимы,[] пока происходит излучение или если вокруг много [blue]Flood[].\
  \nИспользуйте [cyan]антислизь,[] чтобы разрушить их неуязвимость и нанести дополнительный урон.
tutorial.content2 = \uf872 [red]Споровые Пусковые Установки[]\
  \n\
  \n[accent]Ториевые Реакторы[] стреляют дальнобойными [purple]Спорами,[] которые высвобождают [blue]Flood[] в момент взрыва.\
  \nЗащититесь от [purple]Спор[] посредством:\
  \n\uf80e [accent]Сегментов[]\
  \n\uf898 [accent]Силовых Проекторов[]\
  \n\uf682 [accent]Ударно-волновых Башен[]\
  \n\uf7aa[accent]Щитов Юнитов[].
tutorial.content3 = \uf88b [red]Электромагнитные Катапульты Flood[]\
  \n\
  \n[accent]Электромагнитные катапульты[] переносят [blue]Flood[] на дальние расстояния.
tutorial.content4 = \uf6ad [red]Радары Flood[]\
  \n\
  \n[accent]Радары[] атакуют самых крепких юнитов после кратковременной подготовки.\
  \nУрон растёт вместе с множителями Flood.
tutorial.content5 = \uf682 [red]Проекторы Flood[]\
  \n\
  \n[accent]Ударно-волновые Башни[] размещают [blue]Flood[] на зданиях рядом.
tutorial.content6 = \uf7fa [red]Юниты-Криперы[]\
  \n\
  \n[accent]Юниты из Ветки Ползунов[] взрываются и высвобождают [blue]Flood[] при контакте с постройками.\
  \nЮниты более высокого уровня распространяют гораздо больше [blue]Flood[].
tutorial.content7 = [cyan]Антислизь[]\
  \n\
  \nИгроки могут распространять [cyan]Антислизь[] для подавления роста Flood внутри определённой области.\
  \n\uf897 [accent]Шоковые Мины[] – Малая площать, короткая продолжительность.\
  \n\uf7fa [accent]Ползуны[] – Средняя площадь, средняя продолжительность.\
  \n\uf687[accent]Погибель[] – Огромная площадь, длительный период.\
  \n\
  \n[crimson]⚠ Предупреждение: [cyan]Антислизь [red]не[white] удаляет существующий Flood!
tutorial.content8 = \uf7aa[green]Щиты Юнитов[]\
  \n\
  \nЩиты \uf7fb [gold]Квазаров[] и \uf7c2 [gold]Октов[] [red]повреждают[] [blue]Flood[], но [blue]Flood[] также [red]повреждает[] щиты в ответ.\
  \nПостарайтесь не заходить слишком далеко!
tutorial.content9 = \uf898 [green]Силовые Проекторы[]\
  \n\
  \n[gold] Силовые Проекторы[] замедляют распространение [blue]Flood[] вместо его повреждения.\
  \n\
  \n[stat]Внимание:[] [gold]Силовые Проекторы[] разрушаются моментально, если задеты [blue]Flood.
tutorial.content10 = \uf6ad [green]Радары[]\
  \n\
  \n[gold]Радары[] восстанавливают [blue]Flood[] в ресурсы, если они размещены возле [accent]Контейнера[] или [stat]Ядра[].\
  \nРесурсы зависят от [blue]уровня Flood[].\
  \nВозможное количество радаров [accent]ограничено[].\
  \nВоспользуйтесь [slate]/radarinfo[] для подробностей.
tutorial.content11 = \uf866 [green]Тайники[]\
  \n\
  \n[gold]Тайники[], запрятанные в [blue]Flood[], содержат ресурсы.\
  \nЗахватите их, чтобы забрать содержимое.\
  \n\
  \n[scarlet]⚠ Осторожно:[] Если [gold]Тайник[] уничтожен, то его ресурсы утрачены!

tutorial.additions0 = \uf7e4 [pink]Программирование[]\
  \n\
  \nВ целях баланса программирование ограничено. Процессоры не могут контролировать юнитов.
tutorial.additions1 = \ue84d [pink]Неуязвимость к Flood[]\
  \n\
  \n\uf7f1 [accent]Моно[] [gold]неуязвим[] к [blue]Flood[], что эффективно для доставки грузов.
tutorial.additions2 = \uf899 [pink]Сверхпривод[]\
  \n\
  \n[gold]Сверхприводные Проекторы и Купола[] наделяют союзные юниты эффектом \uf7ab [accent]Перегрузки[].
tutorial.additions3 = \uf8ac [pink]Проходимые Стены[]\
  \n\
  \nЮниты могут проходить по малым\uf8a0 [accent]Металлоломным[],\
  \n\uf8ac [accent]Титановым[], и \uf8a8 [accent]Ториевым[] стенам.
tutorial.additions4 = \uf7e9 [pink]Помощники[]\
  \n\
  \nКаждое [accent]Ядро[] спавнит [gold]Помощников[] для добычи, строительства или атаки.

tutorial.modes0 = [sky]\ue861 Flood ПвП[]\
  \n\
  \nПвП с неожиданностями! Особенности включают:\
  \n> Полигональную защиту ядра на старте.\
  \n> Высокоуровневые Ползуны распространяют Flood на вражеские здания.
tutorial.modes1 = [sky]\ue86e Страж[]\
  \n\
  \nСлучайный игрок присоединяется к команде [blue]Flood[], получая специальные способности, чтобы помочь Flood победить.
tutorial.modes2 = [sky]\ue82d Рандомизация[]\
  \n\
  \nВсе месторождения, стены и тайлы на карте становятся случайными!\
  \nНекоторые карты рандомизированы в начале игры или периодически несколько раз.\
  \n\
  \nВы можете начать голосование за Рандомизацию карты, используя [slate]/scramble[].

