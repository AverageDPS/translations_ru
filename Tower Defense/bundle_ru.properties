# Tutorial entries
tutorial.welcome.title = Добро пожаловать!
tutorial.welcome = [lightgray]Добро пожаловать на [accent]интерактивное обучение[]!\
  \nВыберите ниже категорию, чтобы узнать больше об Обороне Башни!
tutorial.forced.title = Ну что ж...
tutorial.forced = [accent]Привет!\
  \n\
  \n[lightgray]Кажется, вы пропустили обучение. Давайте вместе его посмотрим!
tutorial.reminder.title = Привет!
tutorial.reminder = [accent]Привет!\
  \n\
  \n[lightgray]Кажется, вы играли некоторое время!\
  \nПочему бы не потратить [white]одну минуту[] для прочтения обучения и обнаружения новых особенностей?

tutorial.intro0 = В [orange]\ue86d Обороне Башни[], вражеские юниты не могут атаковать и следуют [stat]заданному пути[].\
  \n\
  \nКак только они достигнут \uf867 [stat]Ядра[], то они повредят его.
tutorial.intro1 = [stat]Вражеские юниты[] дропают ресурсы (награду), когда они [red]погибают[].\
  \n\
  \n[red]Нет других способов получить ресурсы в[] \uf867 [stat]Ядре[].
tutorial.intro2 = Некоторые механики уникальны в\
  \n[orange]\ue86d Обороне Башни[]\
  \n\
  \n[stat]\ue86d Вражеские юниты[] не имеют коллизий[].\
  \n[#ff6f]\uf7b6Fire[] не наносит [scarlet]урон[] зданиям.\
  \n\uf869 [stat]Ядра[] не [red]взрываются[] после разрушения.
tutorial.intro3 = Используйте [stat]\ue804Магазин улучшений[] для покупки улучшений команды.\
  \nОткройте его с помощью [slate]/shop[].

tutorial.content0 = \uf7f1 [gold]Жертвование Моно[]\
  \n\
  \n[stat]Моно[] окружают [stat]Ядро[] и жертвуют собой, чтобы восстановить его.\
  \n\
  \n[red]Это – единственный способ восстанавливать Ядра.
tutorial.content1 = \uf89b & \uf89a [gold]Электрические поля[]\
  \n\
  \n[accent]Регенераторы[] повреждают и замедляют врагов.\
  \n\
  \n[red]Они не восстанавливают Ядра.
tutorial.content2 = \uf898 [gold]Ослабляющие проекторы[]\
  \n\
  \n[accent]Силовые проекторы[] замедляют врагов и увеличивает получаемый ими урон.
tutorial.content3 = \uf848 & \uf790 [gold]Перегружающие туррели[]\
  \n\
  \n[stat]Ремонтные пункты[] наделяют рядом союзных юнитов \uf7ab[stat]Перегруженным[] статус-эффектом.\
  \nОни не требуют энергии.
tutorial.content4 = \uf80e [gold]Усилители снарядов[]\
  \n\
  \n[stat]Сегменты[] и [stat]Строительные башни[] умножают длительность статус-эффектов и урон любых снарядов в радиусе на [yellow]{0}x[].\
  \nОни не требуют энергии.
tutorial.content5 = \uf7be [gold]&[] \uf7c6[gold]Разрушители Щитов[]\
  \n\
  \n[stat]Знамения[] наносят [yellow]{0}k[] урона вражеским [tan]\uf7aaЩитам[].\
  \n[stat]Омуры[] наносят [yellow]{1}k[] урона вражеским [tan]\uf7aaЩитам[].
tutorial.content6 = \uf7c2 [gold]Тяжёлая поддержка[]\
  \n\
  \n[stat]Окты[] замедляют врагов и накладывают на них эффект \uf7a6[olive]Коррозии[].\
  \n[stat]Окты[] дают союзникам эффекты \uf7ac[stat]Перегрузки[] и\
  \n\uf7a9[red]Стража[].
tutorial.content7 = \uf6ff [gold]Нагреватели[]\
  \n\
  \n[stat]Регенерирующие проекторы[] накладывают эффекты \uf7b6[goldenrod]Горения[] и \uf7b0[#ff6f]Плавления[] на врагов в радиусе.\
  \nОни требуют [cyan]{0}[] \uf71f[cyan]водорода/с[].\
  \n\uf82d[stat]Фазовая ткань[] увеличивает урон.
tutorial.content8 = \uf6ad [gold]Контролирующие Радары[]\
  \n\
  \n[stat]Радары[] переводят первых врагов, которые вошли в их радиус, в вашу команду.\
  \nПерезарядка: [cyan]{0} минут[].\
  \nТолько [cyan]{1}[] может одновременно существовать.
tutorial.content9 = \uf682 [gold]Фазерные башни[]\
  \n\
  \n[stat]Ударно-волновые башни[] выстреливают лучи максимум по [cyan]{0}[] целям.\
  \nКаждый луч стартует с [cyan]{1} урона/с[] и поднимается вплоть до [cyan]{2}урона/с[].\
  \nОни требуют [cyan]{3}[] \uf714[cyan]циана/с[].
